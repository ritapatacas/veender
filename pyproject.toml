[project]
name = "veender-streamlit-frontend"
version = "1.0.0"
description = "Frontend Streamlit for VEENDER"
requires-python = ">=3.8"
dependencies = [
    "streamlit>=1.25.0",
    "requests>=2.31.0",
    "pillow>=10.0.0"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
